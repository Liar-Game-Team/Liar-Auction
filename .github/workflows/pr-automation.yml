name: PR CI and AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # 1. PR 시 자동 빌드 & 테스트 (CI)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 빌드 환경 설정
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test with Gradle
        run: ./gradlew test

  # 3. AI 코드 리뷰어 (OpenAI)
  ai-code-review:
    runs-on: ubuntu-latest
    needs: build-and-test # 빌드 성공 시에만 리뷰 진행
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: OpenAI Code Review Action
        uses: anc95/ChatGPT-CodeReview@v1.0.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL: gpt-4o-mini
          LANGUAGE: Korean
