plugins {
    id 'java'
}

group = 'liarauction'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 테스트 전용 (게임 코드는 외부 라이브러리 없이 작성)
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

// 실행: ./gradlew runServer (포트 변경: --args="6000"), ./gradlew runClient
tasks.register('runServer', JavaExec) {
    group = 'application'
    description = '게임 서버 실행'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'liarauction.server.ServerMain'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('runClient', JavaExec) {
    group = 'application'
    description = '클라이언트 실행'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'liarauction.client.ClientMain'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}
